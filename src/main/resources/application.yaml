spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_zero_code_hub
    username: root
    password: ${DATABASE_PASSWORD}
  application:
   name: ai-zero-code-hub
  data:
    redis:
      host: localhost
      port: 6379
#      password: 123456
      ttl: 3600

  session:
    store-type: redis
    redis:
      namespace: ai-zero-code-hub:session
  servlet:
    session:
      timeout: 30m

server:
  port: 8123
  servlet:
    context-path: /api


springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.swu.aiZeroCodeHub


knife4j:
  enable: true
  setting:
    language: zh_cn


langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-test}
      model-name: deepseek-chat
      log-responses: true
      log-requests: true
#      合理设置token参数，防止JSON字符串被中途截断
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
#    流式输出
    streaming-chat-model:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:sk-test}
        model-name: deepseek-chat
        log-responses: true
        log-requests: true
        #      合理设置token参数，防止JSON字符串被中途截断
        max-tokens: 8192



